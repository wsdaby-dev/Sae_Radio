<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Station Météo</title>

<!-- Chart.js (si tu veux ajouter des graphes plus tard) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root {
    --primary: #0ea5e9;
    --primary-dark: #0369a1;
    --bg: #0b1220;
    --card-bg: #020617;
    --text: #e5e7eb;
    --danger: #ef4444;
    --border: #1f2937;
    --muted: #9ca3af;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #1d4ed8 0, #020617 45%, #000 100%);
    color: var(--text);
    text-align: center;
}

h1 { margin-top: 20px; }

.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin: 20px auto;
    width: 380px;
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.4);
}

input, button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px;
    margin: 5px;
    border-radius: 10px;
    font-size: 15px;
    width: 80%;
}

button {
    background: var(--primary);
    border-color: var(--primary-dark);
    font-weight: 600;
    cursor: pointer;
}

button:hover { background: var(--primary-dark); }

#logoutBtn, #logoutAdminBtn {
    background: var(--danger);
    border-color: #b91c1c;
}

.choice-btn {
    width: 80%;
    max-width: 320px;
    display: block;
    margin: 10px auto;
    padding: 12px;
    border-radius: 999px;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

#app, #adminPanel,
#loginUserDiv, #loginAdminDiv,
#signupDiv, #personalInfoDiv {
    display: none;
}
</style>
</head>

<body>

<h1>🌤 Station Météo</h1>

<!-- Accueil : choix -->
<div id="homeChoice" class="card">
    <h3>Bienvenue</h3>
    <p style="color:var(--muted); font-size:14px;">
        Choisissez votre type de connexion.
    </p>
    <button class="choice-btn" id="btnGoUser">👤 Connexion utilisateur</button>
    <button class="choice-btn" id="btnGoAdmin">🛡️ Connexion administrateur</button>
</div>

<!-- Connexion Utilisateur -->
<div id="loginUserDiv" class="card">
    <h3>Connexion utilisateur</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <button onclick="showSignup()">Créer un compte</button>
    <button onclick="backToHome()">⬅ Retour</button>
</div>

<!-- Inscription -->
<div id="signupDiv" class="card">
    <h3>Créer un compte</h3>
    <input type="email" id="signupEmail" placeholder="Email">
    <input type="password" id="signupPassword" placeholder="Mot de passe">
    <button onclick="signup()">S'inscrire</button>
    <button onclick="backToLoginUser()">⬅ Retour</button>
</div>

<!-- Infos perso -->
<div id="personalInfoDiv" class="card">
    <h3>Informations personnelles</h3>
    <input type="text" id="firstName" placeholder="Prénom">
    <input type="text" id="lastName" placeholder="Nom">
    <input type="number" id="age" placeholder="Âge">
    <button onclick="savePersonalInfo()">Valider</button>
</div>

<!-- Connexion Admin -->
<div id="loginAdminDiv" class="card">
    <h3>Connexion administrateur</h3>
    <input type="email" id="adminEmail" placeholder="Email admin">
    <input type="password" id="adminPassword" placeholder="Mot de passe">
    <button onclick="adminLogin()">Se connecter admin</button>
    <button onclick="backToHome()">⬅ Retour</button>
</div>

<!-- Interface Utilisateur -->
<div id="app">
    <div class="card">
        <h2>Vue en temps réel</h2>
        <div>Extérieur : <span id="tempExt">--</span> °C / <span id="humExt">--</span> %</div>
        <div>Intérieur : <span id="tempInt">--</span> °C / <span id="humInt">--</span> %</div>
        <button id="btnLampe" onclick="toggleLampe()">Lampe : OFF</button>
    </div>

    <button id="logoutBtn" onclick="logout()">Déconnexion</button>
</div>

<!-- Panel Admin -->
<div id="adminPanel" class="card">
    <h3>Panel administrateur</h3>
    <h4 id="userCount"></h4>
    <div id="usersList"></div>
    <button id="logoutAdminBtn" onclick="logout()">Déconnexion admin</button>
</div>

<script>
// ---------------------- Firebase v8 ----------------------
var firebaseConfig = {
    apiKey: "AIzaSyAayeCDVcmcFpX3qT126MFJMUGCE3S_xtY",
    authDomain: "saeradio-4cb75.firebaseapp.com",
    databaseURL: "https://saeradio-4cb75-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "saeradio-4cb75",
    storageBucket: "saeradio-4cb75.appspot.com",
    messagingSenderId: "88549628626",
    appId: "1:88549628626:web:0f8ae72085e727e6452b0b"
};
firebase.initializeApp(firebaseConfig);

var auth = firebase.auth();
var db   = firebase.database();

// ---------------------- DOM ----------------------
var homeChoice      = document.getElementById("homeChoice");
var loginUserDiv    = document.getElementById("loginUserDiv");
var loginAdminDiv   = document.getElementById("loginAdminDiv");
var signupDiv       = document.getElementById("signupDiv");
var personalInfoDiv = document.getElementById("personalInfoDiv");
var appDiv          = document.getElementById("app");
var adminPanel      = document.getElementById("adminPanel");

var tempExt = document.getElementById("tempExt");
var humExt  = document.getElementById("humExt");
var tempInt = document.getElementById("tempInt");
var humInt  = document.getElementById("humInt");
var btnLampe= document.getElementById("btnLampe");

// ---------------------- Navigation ----------------------
document.getElementById("btnGoUser").addEventListener("click", function() {
    homeChoice.style.display = "none";
    loginUserDiv.style.display = "block";
});
document.getElementById("btnGoAdmin").addEventListener("click", function() {
    homeChoice.style.display = "none";
    loginAdminDiv.style.display = "block";
});

function backToHome() {
    homeChoice.style.display      = "block";
    loginUserDiv.style.display    = "none";
    loginAdminDiv.style.display   = "none";
    signupDiv.style.display       = "none";
    personalInfoDiv.style.display = "none";
    appDiv.style.display          = "none";
    adminPanel.style.display      = "none";
}
function showSignup() {
    loginUserDiv.style.display = "none";
    signupDiv.style.display    = "block";
}
function backToLoginUser() {
    signupDiv.style.display    = "none";
    loginUserDiv.style.display = "block";
}
window.backToHome       = backToHome;
window.showSignup       = showSignup;
window.backToLoginUser  = backToLoginUser;

// ---------------------- Inscription ----------------------
function signup() {
    var email    = document.getElementById("signupEmail").value;
    var password = document.getElementById("signupPassword").value;

    if (!email || !password) {
        alert("Email et mot de passe requis");
        return;
    }

    auth.createUserWithEmailAndPassword(email, password)
        .then(function() {
            signupDiv.style.display       = "none";
            personalInfoDiv.style.display = "block";
        })
        .catch(function(err) {
            alert("Erreur inscription : " + err.message);
        });
}
window.signup = signup;

// ---------------------- Infos perso ----------------------
function savePersonalInfo() {
    var user = auth.currentUser;
    if (!user) {
        alert("Utilisateur non connecté");
        return;
    }

    var firstName = document.getElementById("firstName").value;
    var lastName  = document.getElementById("lastName").value;
    var age       = document.getElementById("age").value;

    db.ref("users/" + user.uid).set({
        role: "user",
        firstName: firstName,
        lastName: lastName,
        age: age,
        email: user.email
    }).then(function() {
        personalInfoDiv.style.display = "none";
        appDiv.style.display          = "block";
        initStation();
    });
}
window.savePersonalInfo = savePersonalInfo;

// ---------------------- Connexion utilisateur ----------------------
function login() {
    var email    = document.getElementById("email").value;
    var password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Email et mot de passe requis");
        return;
    }

    auth.signInWithEmailAndPassword(email, password)
        .then(function() {
            loginUserDiv.style.display = "none";
            appDiv.style.display       = "block";
            initStation();
        })
        .catch(function(err) {
            alert("Erreur connexion : " + err.message);
        });
}
window.login = login;

// ---------------------- Connexion admin ----------------------
function adminLogin() {
    var email    = document.getElementById("adminEmail").value;
    var password = document.getElementById("adminPassword").value;

    if (!email || !password) {
        alert("Email et mot de passe requis");
        return;
    }

    auth.signInWithEmailAndPassword(email, password)
        .then(function(cred) {
            var uid = cred.user.uid;
            db.ref("users/" + uid).once("value").then(function(snap) {
                var data = snap.val();
                if (!data || data.role !== "admin") {
                    alert("Vous n'êtes pas administrateur");
                    auth.signOut();
                    return;
                }
                loginAdminDiv.style.display = "none";
                adminPanel.style.display    = "block";
                loadUsersList();
            });
        })
        .catch(function(err) {
            alert("Erreur admin : " + err.message);
        });
}
window.adminLogin = adminLogin;

// ---------------------- Station météo ----------------------
function initStation() {
    var stationRef = db.ref("station");
    stationRef.on("value", function(snap) {
        var data = snap.val() || {};

        if (data.exterieur) {
            tempExt.innerText = data.exterieur.temperature != null ? data.exterieur.temperature : "--";
            humExt.innerText  = data.exterieur.humidite  != null ? data.exterieur.humidite  : "--";
        } else {
            tempExt.innerText = "--";
            humExt.innerText  = "--";
        }

        if (data.interieur) {
            tempInt.innerText = data.interieur.temperature != null ? data.interieur.temperature : "--";
            humInt.innerText  = data.interieur.humidite  != null ? data.interieur.humidite  : "--";
        } else {
            tempInt.innerText = "--";
            humInt.innerText  = "--";
        }

        if (data.lampe === true) {
            btnLampe.innerText = "Lampe : ON";
        } else {
            btnLampe.innerText = "Lampe : OFF";
        }
    });
}

function toggleLampe() {
    var lampeRef = db.ref("station/lampe");
    lampeRef.once("value").then(function(snap) {
        var current = snap.val();
        var newEtat = !current;
        lampeRef.set(newEtat);
        btnLampe.innerText = newEtat ? "Lampe : ON" : "Lampe : OFF";
    });
}
window.toggleLampe = toggleLampe;

// ---------------------- Panel admin ----------------------
function loadUsersList() {
    var usersDiv      = document.getElementById("usersList");
    var userCountDiv  = document.getElementById("userCount");

    usersDiv.innerHTML     = "";
    userCountDiv.innerHTML = "Chargement...";

    db.ref("users").once("value").then(function(snap) {
        if (!snap.exists()) {
            usersDiv.innerHTML     = "Aucun utilisateur";
            userCountDiv.innerHTML = "0 utilisateur";
            return;
        }

        var users = snap.val();
        var count = 0;

        for (var uid in users) {
            var u = users[uid];

            // Ignorer les nœuds vides ou sans email
            if (!u || !u.email) continue;

            count++;

            var div = document.createElement("div");
            div.style.margin      = "10px 0";
            div.style.padding     = "10px";
            div.style.border      = "1px solid #1f2937";
            div.style.borderRadius= "10px";

            div.innerHTML = `
                <strong>${u.firstName || ""} ${u.lastName || ""}</strong><br>
                Email : ${u.email}<br>
                Âge : ${u.age || "?"}<br>
                Rôle : ${u.role || "user"}<br><br>
                <button onclick="deleteUser('${uid}')" 
                        style="background:#ef4444;border-color:#b91c1c;">
                    Supprimer
                </button>
            `;

            usersDiv.appendChild(div);
        }

        userCountDiv.innerHTML = count + " utilisateur(s)";
    });
}

function deleteUser(uid) {
    if (!confirm("Supprimer cet utilisateur ?")) return;

    db.ref("users/" + uid).remove()
        .then(function() {
            alert("Utilisateur supprimé");
            loadUsersList();
        })
        .catch(function(err) {
            alert("Erreur : " + err.message);
        });
}
window.deleteUser = deleteUser;

// ---------------------- Déconnexion ----------------------
function logout() {
    auth.signOut().then(function() {
        backToHome();
    });
}
window.logout = logout;

// ---------------------- Auth state ----------------------
auth.onAuthStateChanged(function(user) {
    if (!user) {
        backToHome();
        return;
    }

    db.ref("users/" + user.uid).once("value").then(function(snap) {
        var data = snap.val();
        if (data && data.role === "admin") {
            homeChoice.style.display      = "none";
            loginUserDiv.style.display    = "none";
            loginAdminDiv.style.display   = "none";
            signupDiv.style.display       = "none";
            personalInfoDiv.style.display = "none";
            appDiv.style.display          = "none";
            adminPanel.style.display      = "block";
            loadUsersList();
        } else {
            homeChoice.style.display      = "none";
            loginUserDiv.style.display    = "none";
            loginAdminDiv.style.display   = "none";
            signupDiv.style.display       = "none";
            personalInfoDiv.style.display = "none";
            adminPanel.style.display      = "none";
            appDiv.style.display          = "block";
            initStation();
        }
    });
});
</script>

</body>
</html>
