<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Station Météo</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body {
    margin: 0;
    font-family: system-ui;
    background: #0b1220;
    color: white;
    text-align: center;
}
.card {
    background: #111827;
    padding: 20px;
    margin: 20px auto;
    width: 380px;
    border-radius: 15px;
}
input, button {
    width: 80%;
    padding: 10px;
    margin: 5px;
    border-radius: 10px;
    border: none;
}
button {
    background: #2563eb;
    color: white;
    cursor: pointer;
}
button:hover {
    background: #1d4ed8;
}
.graph-container {
    background: #111827;
    padding: 15px;
    margin: 10px auto;
    width: 95%;
    border-radius: 15px;
}
</style>
</head>
<body>
<h1>🌤 Station Météo</h1>
<div id="homeChoice" class="card">
    <h3>Bienvenue</h3>
    <button id="btnGoUser">Connexion utilisateur</button>
    <button id="btnGoAdmin">Connexion administrateur</button>
</div>

<div id="loginUserDiv" class="card" style="display:none;">
    <h3>Connexion utilisateur</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <button onclick="showSignup()">Créer un compte</button>
    <button onclick="backToHome()">Retour</button>
</div>

<div id="signupDiv" class="card" style="display:none;">
    <h3>Créer un compte</h3>
    <input type="email" id="signupEmail" placeholder="Email">
    <input type="password" id="signupPassword" placeholder="Mot de passe">
    <input type="text" id="signupUsername" placeholder="Nom d'utilisateur">
    <input type="number" id="signupAge" placeholder="Âge">
    <button onclick="signup()">S'inscrire</button>
    <button onclick="backToLoginUser()">Retour</button>
</div>

<div id="loginAdminDiv" class="card" style="display:none;">
    <h3>Connexion administrateur</h3>
    <input type="email" id="adminEmail" placeholder="Email admin">
    <input type="password" id="adminPassword" placeholder="Mot de passe">
    <button onclick="adminLogin()">Se connecter</button>
    <button onclick="backToHome()">Retour</button>
</div>

<div id="app" style="display:none;">
    <div class="card">
        <h2>Temps réel</h2>
        <div>Extérieur : <span id="tempExt">--</span> °C / <span id="humExt">--</span> %</div>
        <div>Intérieur : <span id="tempInt">--</span> °C / <span id="humInt">--</span> %</div>
        <button id="btnLampe" onclick="toggleLampe()">Lampe : OFF</button>
    </div>

    <div class="card">
        <h3>Historique</h3>
        <input type="date" id="historyDate">
        <button onclick="loadHistory()">Charger</button>
        <p id="historyStatus"></p>
    </div>

    <div class="graph-container"><canvas id="chartTempInt"></canvas></div>
    <div class="graph-container"><canvas id="chartTempExt"></canvas></div>
    <div class="graph-container"><canvas id="chartHum"></canvas></div>

    <button onclick="logout()">Déconnexion</button>
</div>

<div id="adminPanel" class="card" style="display:none;">
    <h3>Panel administrateur</h3>
    <h4 id="userCount"></h4>
    <div id="usersList"></div>
    <button onclick="logout()">Déconnexion admin</button>
</div>
<script>
var firebaseConfig = {
    apiKey: "AIzaSyAayeCDVcmcFpX3qT126MFJMUGCE3S_xtY",
    authDomain: "saeradio-4cb75.firebaseapp.com",
    databaseURL: "https://saeradio-4cb75-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "saeradio-4cb75",
    storageBucket: "saeradio-4cb75.appspot.com",
    messagingSenderId: "88549628626",
    appId: "1:88549628626:web:0f8ae72085e727e6452b0b"
};
firebase.initializeApp(firebaseConfig);

var auth = firebase.auth();
var db = firebase.database();

document.getElementById("btnGoUser").onclick = () => {
    homeChoice.style.display = "none";
    loginUserDiv.style.display = "block";
};

document.getElementById("btnGoAdmin").onclick = () => {
    homeChoice.style.display = "none";
    loginAdminDiv.style.display = "block";
};

function backToHome() {
    homeChoice.style.display = "block";
    loginUserDiv.style.display = "none";
    loginAdminDiv.style.display = "none";
    signupDiv.style.display = "none";
    app.style.display = "none";
    adminPanel.style.display = "none";
}

function showSignup() {
    loginUserDiv.style.display = "none";
    signupDiv.style.display = "block";
}

function backToLoginUser() {
    signupDiv.style.display = "none";
    loginUserDiv.style.display = "block";
}

function signup() {
    let email = signupEmail.value;
    let pass = signupPassword.value;
    let user = signupUsername.value;
    let age = signupAge.value;

    auth.createUserWithEmailAndPassword(email, pass)
        .then(cred => {
            return db.ref("users/" + cred.user.uid).set({
                email: email,
                username: user,
                age: age,
                role: "user"
            });
        })
        .then(() => {
            signupDiv.style.display = "none";
            app.style.display = "block";
            initStation();
            initCharts();
        });
}

function login() {
    auth.signInWithEmailAndPassword(email.value, password.value)
        .then(() => {
            loginUserDiv.style.display = "none";
            app.style.display = "block";
            initStation();
            initCharts();
        });
}

function adminLogin() {
    auth.signInWithEmailAndPassword(adminEmail.value, adminPassword.value)
        .then(cred => {
            db.ref("users/" + cred.user.uid).once("value").then(s => {
                let d = s.val();
                if (!d || d.role !== "admin") {
                    alert("Pas admin");
                    auth.signOut();
                    return;
                }
                loginAdminDiv.style.display = "none";
                adminPanel.style.display = "block";
                loadUsersList();
            });
        });
}

function logout() {
    auth.signOut().then(backToHome);
}

auth.onAuthStateChanged(user => {
    if (!user) return backToHome();

    db.ref("users/" + user.uid).once("value").then(s => {
        let d = s.val();
        if (!d) return auth.signOut();

        if (d.role === "admin") {
            homeChoice.style.display = "none";
            adminPanel.style.display = "block";
            loadUsersList();
        } else {
            homeChoice.style.display = "none";
            app.style.display = "block";
            initStation();
            initCharts();
        }
    });
});
// Graphes
var chartTempInt = null;
var chartTempExt = null;
var chartHum = null;

var realtimeLabels = [];
var realtimeIntData = [];
var realtimeExtData = [];
var realtimeHumData = [];

function initCharts() {
    if (chartTempInt) chartTempInt.destroy();
    if (chartTempExt) chartTempExt.destroy();
    if (chartHum) chartHum.destroy();

    chartTempInt = new Chart(document.getElementById("chartTempInt"), {
        type: "line",
        data: { labels: realtimeLabels, datasets: [{ label:"Intérieur", data: realtimeIntData, borderColor:"orange" }] }
    });

    chartTempExt = new Chart(document.getElementById("chartTempExt"), {
        type: "line",
        data: { labels: realtimeLabels, datasets: [{ label:"Extérieur", data: realtimeExtData, borderColor:"blue" }] }
    });

    chartHum = new Chart(document.getElementById("chartHum"), {
        type: "line",
        data: { labels: realtimeLabels, datasets: [{ label:"Humidité", data: realtimeHumData, borderColor:"green" }] }
    });
}

// Station temps réel
var stationAttached = false;

function initStation() {
    if (stationAttached) return;
    stationAttached = true;

    db.ref("station").on("value", snap => {
        let d = snap.val() || {};

        tempExt.innerText = d.exterieur?.temperature ?? "--";
        humExt.innerText  = d.exterieur?.humidite ?? "--";

        tempInt.innerText = d.interieur?.temperature ?? "--";
        humInt.innerText  = d.interieur?.humidite ?? "--";

        btnLampe.innerText = d.lampe ? "Lampe : ON" : "Lampe : OFF";

        let t = new Date().toLocaleTimeString();

        if (realtimeLabels.length > 50) {
            realtimeLabels.shift();
            realtimeIntData.shift();
            realtimeExtData.shift();
            realtimeHumData.shift();
        }

        realtimeLabels.push(t);
        realtimeIntData.push(d.interieur?.temperature ?? null);
        realtimeExtData.push(d.exterieur?.temperature ?? null);
        realtimeHumData.push(d.interieur?.humidite ?? null);

        chartTempInt.update();
        chartTempExt.update();
        chartHum.update();
    });
}

function toggleLampe() {
    db.ref("station/lampe").once("value").then(s => {
        db.ref("station/lampe").set(!s.val());
    });
}

// Historique
function loadHistory() {
    let date = historyDate.value;
    if (!date) return;

    db.ref("historique/" + date).once("value").then(snap => {
        if (!snap.exists()) {
            historyStatus.innerText = "Aucune donnée";
            return;
        }

        let data = snap.val();
        let keys = Object.keys(data).sort();

        realtimeLabels.length = 0;
        realtimeIntData.length = 0;
        realtimeExtData.length = 0;
        realtimeHumData.length = 0;

        keys.forEach(k => {
            realtimeLabels.push(k);
            realtimeIntData.push(data[k].interieur?.temperature ?? null);
            realtimeExtData.push(data[k].exterieur?.temperature ?? null);
            realtimeHumData.push(data[k].interieur?.humidite ?? null);
        });

        chartTempInt.update();
        chartTempExt.update();
        chartHum.update();

        historyStatus.innerText = "Historique chargé";
    });
}

// Admin
function loadUsersList() {
    usersList.innerHTML = "";
    userCount.innerText = "Chargement...";

    db.ref("users").once("value").then(snap => {
        if (!snap.exists()) {
            usersList.innerHTML = "Aucun utilisateur";
            userCount.innerText = "0 utilisateur";
            return;
        }

        let users = snap.val();
        let count = 0;

        for (let uid in users) {
            let u = users[uid];

            const email = u.email || "Non renseigné";
            const username = u.username || "Inconnu";
            const age = u.age || "Non renseigné";
            const role = u.role || "user";

            count++;

            usersList.innerHTML += `
                <div style="border:1px solid #333; padding:10px; margin:10px;">
                    <strong>${username}</strong><br>
                    Email : ${email}<br>
                    Âge : ${age}<br>
                    Rôle : ${role}<br><br>
                    <button onclick="deleteUser('${uid}')">Supprimer</button>
                </div>
            `;
        }

        userCount.innerText = count + " utilisateur(s)";
    });
}

function deleteUser(uid) {
    if (!confirm("Supprimer ?")) return;
    db.ref("users/" + uid).remove().then(loadUsersList);
}
</script>
</body>
</html>
