<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Station Météo</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root {
    --primary: #0ea5e9;
    --primary-dark: #0369a1;
    --bg: #0b1220;
    --card-bg: #020617;
    --text: #e5e7eb;
    --danger: #ef4444;
    --border: #1f2937;
    --muted: #9ca3af;
}

body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at top, #1d4ed8 0, #020617 45%, #000 100%);
    color: var(--text);
    text-align: center;
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin: 20px auto;
    width: 380px;
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.4);
}

input, button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px;
    margin: 5px;
    border-radius: 10px;
    width: 80%;
}

button {
    background: var(--primary);
    border-color: var(--primary-dark);
    font-weight: 600;
    cursor: pointer;
}

button:hover { background: var(--primary-dark); }

#logoutBtn, #logoutAdminBtn {
    background: var(--danger);
    border-color: #b91c1c;
}

.choice-btn {
    width: 80%;
    max-width: 320px;
    margin: 10px auto;
    padding: 12px;
    border-radius: 999px;
    font-size: 16px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

#app, #adminPanel, #loginUserDiv, #loginAdminDiv, #signupDiv, #personalInfoDiv {
    display: none;
}
</style>
</head>

<body>

<h1>🌤 Station Météo</h1>

<!-- Accueil -->
<div id="homeChoice" class="card">
    <h3>Bienvenue</h3>
    <button class="choice-btn" id="btnGoUser">👤 Connexion utilisateur</button>
    <button class="choice-btn" id="btnGoAdmin">🛡️ Connexion administrateur</button>
</div>

<!-- Connexion utilisateur -->
<div id="loginUserDiv" class="card">
    <h3>Connexion utilisateur</h3>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <button onclick="showSignup()">Créer un compte</button>
    <button onclick="backToHome()">⬅ Retour</button>
</div>

<!-- Inscription -->
<div id="signupDiv" class="card">
    <h3>Créer un compte</h3>
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Mot de passe">
    <button onclick="signup()">S'inscrire</button>
    <button onclick="backToLoginUser()">⬅ Retour</button>
</div>

<!-- Infos perso -->
<div id="personalInfoDiv" class="card">
    <h3>Informations personnelles</h3>
    <input id="firstName" type="text" placeholder="Prénom">
    <input id="lastName" type="text" placeholder="Nom">
    <input id="age" type="number" placeholder="Âge">
    <button onclick="savePersonalInfo()">Valider</button>
</div>

<!-- Connexion admin -->
<div id="loginAdminDiv" class="card">
    <h3>Connexion administrateur</h3>
    <input id="adminEmail" type="email" placeholder="Email admin">
    <input id="adminPassword" type="password" placeholder="Mot de passe">
    <button onclick="adminLogin()">Connexion admin</button>
    <button onclick="backToHome()">⬅ Retour</button>
</div>

<!-- Interface utilisateur -->
<div id="app">
    <div class="card">
        <h2>Vue en temps réel</h2>
        <div>Extérieur : <span id="tempExt">--</span> °C / <span id="humExt">--</span>%</div>
        <div>Intérieur : <span id="tempInt">--</span> °C / <span id="humInt">--</span>%</div>
        <button id="btnLampe" onclick="toggleLampe()">Lampe : OFF</button>
    </div>

    <button id="logoutBtn" onclick="logout()">Déconnexion</button>
</div>

<!-- Panel admin -->
<div id="adminPanel" class="card">
    <h3>Panel Administrateur</h3>
    <h4 id="userCount"></h4>
    <div id="usersList"></div>
    <button id="logoutAdminBtn" onclick="logout()">Déconnexion admin</button>
</div>

<script>
// ---------------- Firebase v8 ----------------
var firebaseConfig = {
    apiKey: "AIzaSyAayeCDVcmcFpX3qT126MFJMUGCE3S_xtY",
    authDomain: "saeradio-4cb75.firebaseapp.com",
    databaseURL: "https://saeradio-4cb75-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "saeradio-4cb75",
    storageBucket: "saeradio-4cb75.appspot.com",
    messagingSenderId: "88549628626",
    appId: "1:88549628626:web:0f8ae72085e727e6452b0b"
};
firebase.initializeApp(firebaseConfig);

var auth = firebase.auth();
var db = firebase.database();

// ---------------- Navigation ----------------
document.getElementById("btnGoUser").onclick = () => {
    homeChoice.style.display = "none";
    loginUserDiv.style.display = "block";
};
document.getElementById("btnGoAdmin").onclick = () => {
    homeChoice.style.display = "none";
    loginAdminDiv.style.display = "block";
};

function backToHome() {
    homeChoice.style.display = "block";
    loginUserDiv.style.display = "none";
    loginAdminDiv.style.display = "none";
    signupDiv.style.display = "none";
    personalInfoDiv.style.display = "none";
    appDiv.style.display = "none";
    adminPanel.style.display = "none";
}
function showSignup() {
    loginUserDiv.style.display = "none";
    signupDiv.style.display = "block";
}
function backToLoginUser() {
    signupDiv.style.display = "none";
    loginUserDiv.style.display = "block";
}

// ---------------- Inscription ----------------
function signup() {
    var email = signupEmail.value;
    var password = signupPassword.value;

    auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
            signupDiv.style.display = "none";
            personalInfoDiv.style.display = "block";
        })
        .catch(err => alert(err.message));
}

// ---------------- Sauvegarde infos perso ----------------
function savePersonalInfo() {
    var user = auth.currentUser;
    if (!user) return;

    db.ref("users/" + user.uid).set({
        role: "user",
        firstName: firstName.value,
        lastName: lastName.value,
        age: age.value,
        email: user.email
    });

    personalInfoDiv.style.display = "none";
    appDiv.style.display = "block";
}

// ---------------- Connexion user ----------------
function login() {
    auth.signInWithEmailAndPassword(email.value, password.value)
        .then(() => {
            loginUserDiv.style.display = "none";
            appDiv.style.display = "block";
        })
        .catch(err => alert(err.message));
}

// ---------------- Connexion admin ----------------
function adminLogin() {
    auth.signInWithEmailAndPassword(adminEmail.value, adminPassword.value)
        .then(cred => {
            db.ref("users/" + cred.user.uid).once("value").then(snap => {
                if (!snap.exists() || snap.val().role !== "admin") {
                    alert("Pas admin");
                    auth.signOut();
                    return;
                }
                loginAdminDiv.style.display = "none";
                adminPanel.style.display = "block";
                loadUsersList();
            });
        })
        .catch(err => alert(err.message));
}

// ---------------- Panel admin ----------------
function loadUsersList() {
    var usersDiv = document.getElementById("usersList");
    var userCountDiv = document.getElementById("userCount");

    usersDiv.innerHTML = "";

    db.ref("users").once("value").then(snap => {
        if (!snap.exists()) {
            usersDiv.innerHTML = "Aucun utilisateur";
            userCountDiv.innerHTML = "0 utilisateur";
            return;
        }

        var users = snap.val();
        var count = 0;

        for (var uid in users) {
            count++;
            var u = users[uid];

            var div = document.createElement("div");
            div.style.margin = "10px 0";
            div.style.padding = "10px";
            div.style.border = "1px solid #1f2937";
            div.style.borderRadius = "10px";

            div.innerHTML = `
                <strong>${u.firstName || ""} ${u.lastName || ""}</strong><br>
                Email : ${u.email}<br>
                Âge : ${u.age || "?"}<br>
                Rôle : ${u.role}<br><br>
                <button onclick="deleteUser('${uid}')" 
                        style="background:#ef4444;border-color:#b91c1c;">
                    Supprimer
                </button>
            `;

            usersDiv.appendChild(div);
        }

        userCountDiv.innerHTML = count + " utilisateur(s)";
    });
}

function deleteUser(uid) {
    if (!confirm("Supprimer cet utilisateur ?")) return;

    db.ref("users/" + uid).remove()
        .then(() => {
            alert("Utilisateur supprimé");
            loadUsersList();
        });
}

// ---------------- Déconnexion ----------------
function logout() {
    auth.signOut().then(backToHome);
}

// ---------------- Auth state ----------------
auth.onAuthStateChanged(user => {
    if (!user) return backToHome();

    db.ref("users/" + user.uid).once("value").then(snap => {
        if (snap.exists() && snap.val().role === "admin") {
            homeChoice.style.display = "none";
            adminPanel.style.display = "block";
            loadUsersList();
        } else {
            homeChoice.style.display = "none";
            appDiv.style.display = "block";
        }
    });
});
</script>

</body>
</html>
